input: input.jar
output: output.jar

sandbox:
  enabled: true
  logOnly: false
  maxInstructions: 500000000
  timeoutMillis: 60000
  allow: []
  deny: []

transformers:
  - universal.UniversalFlowTransformer
  - universal.StringBuilderTransformer
  - universal.DeadCodeRemovingTransformer
  - general.peephole.PeepholeOptimizer
  - normalizer.ClassNormalizer
  - normalizer.FieldNormalizer
  - normalizer.MethodNormalizer
